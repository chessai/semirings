name: ci
on:
  push:
    branches:
      - master
  pull_request: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        ghc: ['8.6', '8.8', '8.10', '9.0', '9.2', '9.4', '9.6', '9.8', '9.10', '9.12', '9.14', '10.0']
        exclude:
          - os: macOS-latest
            ghc: '8.6'
          - os: macOS-latest
            ghc: '8.8'
          - os: macOS-latest
            ghc: '8.10'
          - os: macOS-latest
            ghc: '9.0'
          - os: windows-latest
            ghc: '10.0'
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/setup@v2
      id: setup-haskell-cabal
      with:
        ghc-version: ${{ matrix.ghc }}
    - name: Update cabal package database
      run: cabal update
    - uses: actions/cache@v6
      name: Cache cabal stuff
      with:
        path: |
          ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
          dist-newstyle
        key: ${{ runner.os }}-${{ matrix.ghc }}
    - name: Build
      run: cabal build || cabal build || cabal build
    - name: Haddock
      if: ${{ fromJSON(matrix.ghc) >= 8.6 }}
      run: cabal haddock
